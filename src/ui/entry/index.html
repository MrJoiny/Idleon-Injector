<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Idleon Injector</title>
        <script>
            if (!("inert" in HTMLElement.prototype)) {
                Object.defineProperty(HTMLElement.prototype, "inert", {
                    enumerable: true,
                    configurable: true,
                    get() {
                        return this.hasAttribute("inert") && this.getAttribute("inert") !== "false";
                    },
                    set(val) {
                        if (val) {
                            this.setAttribute("inert", "");
                        } else {
                            this.removeAttribute("inert");
                        }
                    },
                });
            }
            let savedTheme = "dark";
            try {
                const stored = localStorage.getItem("uiTheme");
                if (["system", "light", "dark"].includes(stored)) savedTheme = stored;
            } catch {}
            document.documentElement.dataset.theme = savedTheme;
        </script>
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/entry/style.css" />
    </head>

    <body>
        <!-- Background Grid & Noise -->
        <div class="hud-background">
            <div class="grid-overlay"></div>
            <div class="vignette"></div>
        </div>

        <!-- VanJS Mount Point -->
        <script type="module">
            import van from "/vendor/van-1.6.0.js";
            import { App } from "/components/App.js";

            // Mount the application
            van.add(document.body, App());
        </script>
    </body>
</html>
